<section id="portfolio" class="section band">
  <div class="wrap">
    <div class="gallery-head">
      <div>
        <p class="eyebrow">Our Work</p>
        <h2 style="margin-top: 0.75rem; font-size: clamp(1.85rem, 4vw, 2.25rem)">
          Showcase of completed projects
        </h2>
        <p class="muted" style="margin-top: 1rem; max-width: 36rem">
          Scroll through actual projects we have printed, branded, and delivered. Drag, swipe, or
          use the arrows — tap any piece to open it full size.
        </p>
      </div>
      <p class="counter" id="gallery-counter">01 / 15</p>
    </div>
    <div class="gallery-tools">
      <div class="chips">
        <button class="chip is-on" data-gfilter="all">All Projects</button>
        <button class="chip" data-gfilter="branding">Branding</button>
        <button class="chip" data-gfilter="apparel">Apparel</button>
        <button class="chip" data-gfilter="stationery">Print & PVC</button>
      </div>
      <div class="arrow-row" style="display: flex">
        <button class="icon-btn" id="g-prev" aria-label="Scroll gallery left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <button class="icon-btn" id="g-next" aria-label="Scroll gallery right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>
    </div>
  </div>
  <div class="track hide-scroll" id="gallery-track"></div>
  <div class="progress-wrap">
    <div class="progress"><span id="gallery-progress"></span></div>
    <p class="hint">Scroll the gallery</p>
  </div>
</section>
