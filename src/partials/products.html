<section id="products" class="section">
  <div class="wrap">
    <p class="eyebrow">Online Catalog</p>
    <h2 style="margin-top: 0.75rem; font-size: clamp(1.85rem, 4vw, 2.25rem)">
      Browse our quality supplies
    </h2>
    <p class="muted" style="margin-top: 1rem; max-width: 36rem">
      Browse our papers, binding supplies, and custom branding items. Contact us on WhatsApp to
      place an order or enquire about pricing.
    </p>
    <div class="toolbar">
      <div class="chips">
        <button class="chip is-on" data-cat="all">All Items</button>
        <button class="chip" data-cat="paper">Paper & Cardboards</button>
        <button class="chip" data-cat="binding">Binding Supplies</button>
        <button class="chip" data-cat="custom">Custom Print Items</button>
      </div>
      <input
        class="filter-input"
        id="catalog-q"
        placeholder="Filter supplies by name…"
        aria-label="Filter catalog"
      />
    </div>
    <div class="products" id="products-grid"></div>
  </div>
</section>
