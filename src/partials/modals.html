<button class="enq-fab" id="enq-fab" aria-label="Open enquiry basket">
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    width="20"
    height="20"
  >
    <rect x="8" y="2" width="8" height="4" rx="1" />
    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
  </svg>
  <span class="enq-count" id="enq-count">0</span>
</button>

<a
  class="wa-fab"
  id="wa-fab"
  href="https://wa.me/263781977976?text=Hello%20Premier%20Brands%2C%20I%20would%20like%20to%20enquire%20about%20your%20services."
  target="_blank"
  rel="noopener noreferrer"
  aria-label="Chat on WhatsApp"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    width="24"
    height="24"
  >
    <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
  </svg>
</a>

<div
  class="modal"
  id="enquiry-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="enq-modal-title"
>
  <div class="modal-card">
    <button
      class="lb-close"
      id="enq-close"
      aria-label="Close"
      style="position: absolute; right: 1rem; top: 1rem"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        width="16"
        height="16"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
    <h2 id="enq-modal-title">Send an enquiry</h2>
    <p class="muted" style="font-size: 0.875rem; margin-top: 0.35rem">
      We’ll open WhatsApp with your selected items and requirements.
    </p>
    <p style="margin-top: 1rem; font-size: 0.875rem; font-weight: 500">Selected items</p>
    <div id="enq-items"></div>
    <form id="enq-form">
      <div class="row">
        <label
          >Your Name *
          <input id="e-name" required placeholder="e.g. John Moyo" />
        </label>
        <label
          >WhatsApp / Phone *
          <input id="e-phone" type="tel" required placeholder="e.g. +263 78 197 7976" />
        </label>
      </div>
      <label
        >Email Address
        <input id="e-email" type="email" placeholder="e.g. john@company.com" />
      </label>
      <label
        >Requirements / Custom Message *
        <textarea
          id="e-msg"
          required
          placeholder="Quantities, sizes, colours, deadlines, or special instructions…"
        ></textarea>
      </label>
      <button class="btn btn-wa btn-lg btn-full" type="submit" style="margin-top: 1.25rem">
        Send via WhatsApp
      </button>
    </form>
  </div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lb-close" id="lb-close" aria-label="Close">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      width="16"
      height="16"
    >
      <path d="M18 6 6 18M6 6l12 12" />
    </svg>
  </button>
  <button class="lb-prev" id="lb-prev" aria-label="Previous project">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      width="16"
      height="16"
    >
      <path d="m15 18-6-6 6-6" />
    </svg>
  </button>
  <button class="lb-next" id="lb-next" aria-label="Next project">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      width="16"
      height="16"
    >
      <path d="m9 18 6-6-6-6" />
    </svg>
  </button>
  <figure>
    <img id="lb-img" alt="" />
    <figcaption>
      <p class="eyebrow" id="lb-cat"></p>
      <h3 id="lb-title" style="margin-top: 0.25rem; font-size: 1.5rem"></h3>
      <p class="muted" id="lb-desc" style="margin-top: 0.25rem; font-size: 0.875rem"></p>
    </figcaption>
  </figure>
</div>
